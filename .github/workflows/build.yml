on:
  push:
    tags:
      - "v*"
jobs:
  package:
    strategy:
      matrix:
        go-version: ['1.22']
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install Linux dependencies
        run: sudo apt update && sudo apt install -y libgtk-3-dev libwebkit2gtk-4.1-dev
        if: matrix.os == 'ubuntu-latest'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build package macOS
        run: |
          export PATH=${PATH}:`go env GOPATH`/bin
          wails build
          echo "converting .app into a .dmg"
          npm install -g appdmg
          appdmg dmg-spec.json optimus.dmg
          zip optimus.zip optimus.dmg
        if: matrix.os == 'macos-latest'

      - name: Build package linux
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          wails build -tags webkit2_41
          tar -czvf optimus.tar.gz ./build/bin/Optimus
        if: matrix.os == 'ubuntu-latest'

      - name: Build package windows
        run: |
          $GP = (go env GOPATH)
          $env:path = "$env:path;$GP\bin"
          choco install mingw
          wails build
          Compress-Archive -Path .\build\bin\Optimus* -DestinationPath .\optimus.zip
        if: matrix.os == 'windows-latest'

      - name: Upload artifact macOS
        uses: actions/upload-artifact@v4
        with:
          name: optimus-macOS
          path: optimus.zip
        if: matrix.os == 'macos-latest'

      - name: Upload artifact linux
        uses: actions/upload-artifact@v4
        with:
          name: optimus-linux
          path: optimus.tar.gz
        if: matrix.os == 'ubuntu-latest'

      - name: Upload artifact windows
        uses: actions/upload-artifact@v4
        with:
          name: optimus-windows
          path: optimus.zip
        if: matrix.os == 'windows-latest'

  release:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: |
            artifacts/optimus-macOS/optimus.zip
            artifacts/optimus-linux/optimus.tar.gz
            artifacts/optimus-windows/optimus.zip
